name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  validar:
    name: Validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # CAMBIO
          cache-dependency-path: requirements.lock # CAMBIO

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Ejecutar pruebas
        run: pytest --cov=src --cov-report=xml

      - name: Analisis de calidad
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  publicar:
    name: Publicar artefacto
    runs-on: ubuntu-latest
    needs: validar # CAMBIO
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # CAMBIO
          cache-dependency-path: requirements.lock # CAMBIO

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Construir el paquete
        run: python -m build
        
      - name: Verificar consistencia
        run: |
          VERSION_FILE=$(cat VERSION)
          VERSION_PYPROJECT=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$VERSION_FILE" != "$VERSION_PYPROJECT" ]; then
            echo "VERSION ($VERSION_FILE) no coincide con pyproject.toml ($VERSION_PYPROJECT)"
            exit 1
          fi
      
      - name: Leer version del proyecto
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publicar el paquete
        uses: actions/upload-artifact@v4
        with:
          name: despachos-${{ steps.version.outputs.version }}
          path: dist/
          overwrite: true
